[project]
name = "mcp-server-deepdive-deployment"
version = "0.1.0"
description = "MCP server for security testing with malicious components"
requires-python = ">=3.11"
dependencies = [
    "cisco-ai-mcp-scanner>=4.6.0",
    "mcp[cli]>=1.9.0",
    "requests>=2.33.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-server = "mcpserver.__main__:main"
mcp-server-remote = "mcpserver.__main_remote__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpserver"]

[tool.uv]
dev-dependencies = []
